
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f github.zip || { echo "github.zip was not found"; exit 1; }
          unzip -oq github.zip -d .
          test -f settings.gradle || { echo "settings.gradle was not found"; exit 1; }
          test -f app/build.gradle || { echo "app/build.gradle was not found"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "::error::ANDROID_HOME is not set"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME" -name sdkmanager -type f -print || true
            exit 1
          fi
          echo "Using Android SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-AlKahraba-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
