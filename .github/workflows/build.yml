name: Build Android APK - V2.1 Alzaidi

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project V2.1 Alzaidi
        run: |
          test -f github-v21-alzaidi.zip || { echo "github-v21-alzaidi.zip was not found"; exit 1; }
          unzip -oq github-v21-alzaidi.zip -d .
          test -f settings.gradle || { echo "settings.gradle is missing"; exit 1; }
          test -f app/build.gradle || { echo "app/build.gradle is missing"; exit 1; }
          test -f app/src/main/java/com/electro/notebook/SplashActivity.java || { echo "SplashActivity.java is missing"; exit 1; }
          grep -q "com.electro.notebook.preview21" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "::error::ANDROID_HOME is not set"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager was not found"; exit 1; }
          "$SDKMANAGER" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-AlKahraba-V2.1-Alzaidi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
